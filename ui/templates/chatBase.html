<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="ui/static/main.css" />
    <script src="/ui/static/script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/ui/static/logo2.svg">

    <title>{{.Title}}</title>
  </head>
  <body class="main-body">
    <nav class="navbar has-background-black-ter has-border" role="navigation" aria-label="main navigation">
      <div class="navbar-brand px-5 has-background-black-ter">
        <a class="navbar-item" href="/">
          <img src="/ui/static/logo2.svg" alt="Logo">
        </a>
      </div>

        {{if not .IsLoggedIn}}
        <div class="navbar-end">
          <div class="navbar-item">
            <div class="buttons">
              <a class="button is-primary" href="/register">
                <strong>Sign up</strong>
              </a>
              <a class="button is-light" href="/login"> Log in </a>
            </div>
          </div>
        </div>
        {{else}}
        <div class="navbar-end">
          {{if .User.AvatarURL}}
          <figure class="image is-48x48 navbar-item">
            <a href="/profile"
              ><img class="is-rounded" src="{{.User.AvatarURL}}"
            /></a>
          </figure>
          {{else}}
          <figure class="image is-48x48">
            <img
              class="is-rounded"
              src="https://bulma.io/assets/images/placeholders/128x128.png"
            />
          </figure>
          {{end}}
        </div>
        {{end}}
      </div>
    </nav>

    <main>{{block "content" .}}{{end}}</main>
  </body>
</html>
